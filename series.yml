# The list of projects in the "from scratch in Python" series, in learning order.
# `folder` is the checkout directory, `repo` the GitHub repo name, `package` the
# Python distribution name. `property` is the one-line rule the project's
# property-testing page walks through. `builds_on` may only name projects listed earlier.
# `description` is the one-line pitch for search results, link previews and the
# GitHub About box; `topics` are added after COMMON_TOPICS in src/series/config.py.
projects:
  - name: PyOS
    repo: py-os
    folder: os_learning
    package: pyos-learn
    teaches: Operating systems
    description: "Build your own operating system in Python: processes, CPU schedulers, virtual memory, a journaled filesystem and networking, explained for learners."
    topics: [operating-system, os, scheduling, virtual-memory, filesystem, simulator]
    property: "Every disk-arm policy visits each cylinder it was asked for exactly once: nothing lost, nothing made up."
    builds_on: []
  - name: Pebble
    repo: pebble-lang
    folder: pebble-lang
    package: pebble-lang
    teaches: Compilers and programming languages
    description: "Build your own programming language in Python: a lexer, parser, compiler and stack-based bytecode virtual machine, explained for learners."
    topics: [compiler, programming-language, interpreter, bytecode, virtual-machine, parser]
    property: "Whatever text you give `check`, it either says yes or raises a `PebbleError`, and never crashes."
    builds_on: []
  - name: PyDB
    repo: pydb
    folder: pydb
    package: pydb
    teaches: Relational databases
    description: "Build your own SQL database in Python: tables, joins, B-tree indexes, a query planner and transactions, explained for learners."
    topics: [database, sql, relational-database, btree, query-planner]
    property: "A table saved to its file comes back exactly as it went in: schema, rows, next ID and indexes."
    builds_on: []
  - name: PyKV
    repo: pykv
    folder: pykv
    package: pykv
    teaches: Key-value stores
    description: "Build your own key-value store in Python: get and set, expiring keys, persistence and atomic counters, explained for learners."
    topics: [key-value-store, database, cache, redis]
    property: "Whatever you save, loading gives back: the same keys, the same values, the same types."
    builds_on: []
  - name: PyDocDB
    repo: pydoc-db
    folder: pydocdb
    package: pydocdb
    teaches: Document databases
    description: "Build your own document database in Python: collections, a MongoDB-style query language, indexes and aggregation, explained for learners."
    topics: [document-database, database, nosql, mongodb]
    property: "`find` gives exactly the documents a plain Python filter over the list would give."
    builds_on: []
  - name: PyGraphDB
    repo: pygraphdb
    folder: pygraphdb
    package: pygraphdb
    teaches: Graph databases
    description: "Build your own graph database in Python: nodes, edges, traversal, shortest paths and a Cypher-like query language, explained for learners."
    topics: [graph-database, database, graph, cypher]
    property: "Breadth-first search visits every place you can reach, each once, and nowhere else."
    builds_on: []
  - name: PyTSDB
    repo: pytsdb
    folder: pytsdb
    package: pytsdb
    teaches: Time-series databases
    description: "Build your own time-series database in Python: range queries, tags, downsampling and retention policies, explained for learners."
    topics: [time-series, time-series-database, database, metrics]
    property: "However you downsample, the buckets' counts and sums add up to the whole logbook's."
    builds_on: []
  - name: PyVecDB
    repo: pyvecdb
    folder: pyvecdb
    package: pyvecdb
    teaches: Vector databases
    description: "Build your own vector database in Python: distance metrics, nearest-neighbour search and metadata filtering, explained for learners."
    topics: [vector-database, database, similarity-search, embeddings, knn]
    property: "Top-k search finds the same nearest vectors as measuring every one and sorting them."
    builds_on: []
  - name: PyColDB
    repo: pycoldb
    folder: pycoldb
    package: pycoldb
    teaches: Column-family databases
    description: "Build your own column-family database in Python: keyspaces, column families, TTLs and tombstones like Cassandra, explained for learners."
    topics: [column-family, database, nosql, cassandra]
    property: "Compaction tidies up the files but never changes what a read returns."
    builds_on: []
  - name: PyCrypt
    repo: pycrypt
    folder: pycrypt
    package: pycrypt
    teaches: Cryptography
    description: "Build your own cryptography toolkit in Python: hashing, classic ciphers, key derivation, HMAC and signatures, explained for learners."
    topics: [cryptography, hashing, encryption, hmac, security]
    property: "Decrypting with the same shift gives back exactly the text you encrypted."
    builds_on: []
  - name: PyNet
    repo: pynet
    folder: pynet
    package: pynet
    teaches: Computer networking
    description: "Build your own networking library in Python: DNS, TCP, UDP, HTTP, WebSockets and SMTP over raw sockets, explained for learners."
    topics: [networking, tcp, http, dns, websocket, sockets]
    property: "However the bytes are cut up on the way, the receiver gets exactly the frames that were sent."
    builds_on: []
  - name: PyWeb
    repo: pyweb
    folder: pyweb
    package: pyweb
    teaches: HTTP web servers
    description: "Build your own web server in Python: HTTP parsing, routing, templates and static files on top of PyNet, explained for learners."
    topics: [web-server, http, http-server, web-framework, routing]
    property: "Whatever request head you write out, reading it back gives the very same head."
    builds_on: [PyNet, PyCrypt]
  - name: PyGit
    repo: pygit
    folder: pygit
    package: pygit
    teaches: Version control
    description: "Build your own Git in Python: content hashing, trees, commits, branches, staging and diffs, explained for learners."
    topics: [git, version-control, vcs]
    property: "A file's fingerprint always matches Git's own rule: SHA-1 of `blob <size>`, a zero byte, then the file."
    builds_on: []
  - name: PySearch
    repo: pysearch
    folder: pysearch
    package: pysearch
    teaches: Search engines
    description: "Build your own search engine in Python: tokenizing, an inverted index, TF-IDF ranking and boolean queries, explained for learners."
    topics: [search-engine, full-text-search, inverted-index, tf-idf, information-retrieval]
    property: "A search finds exactly what reading every book by hand would find, with the same scores, in the same order."
    builds_on: []
  - name: PyMQ
    repo: pymq
    folder: pymq
    package: pymq
    teaches: Message queues
    description: "Build your own message queue in Python: producers, consumers and a networked broker, explained for learners."
    topics: [message-queue, messaging, pub-sub, broker]
    property: "A saved queue loads back with every message, in the same delivery order."
    builds_on: [PyNet]
  - name: PyLLM
    repo: pyllm
    folder: pyllm
    package: pyllm
    teaches: Language models (the brain)
    description: "Build your own GPT in Python: autograd, attention, a Transformer, a tokenizer and training, explained for learners."
    topics: [llm, gpt, transformer, machine-learning, neural-network, deep-learning]
    property: "`backward()` gets the same slopes as nudging each number a little and measuring."
    builds_on: [Pebble]
  - name: PyStack
    repo: pystack
    folder: pystack
    package: pystack
    teaches: Full-stack integration
    description: "Every project in the series joined into one working platform, from the operating system up to the language model."
    topics: [full-stack, systems, integration]
    property: "Whatever a Pebble program stores with `kv_set`, the next run reads back exactly."
    builds_on:
      - PyOS
      - Pebble
      - PyDB
      - PyKV
      - PyDocDB
      - PyGraphDB
      - PyTSDB
      - PyVecDB
      - PyColDB
      - PyCrypt
      - PyNet
      - PyWeb
      - PyGit
      - PySearch
      - PyMQ
      - PyLLM

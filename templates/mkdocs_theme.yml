theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: deep-purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep-purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - search.highlight

# Social cards need cairo, so they are off unless SOCIAL_CARDS is set (the
# shared docs workflow sets it). A repo must not add its own plugins key.
plugins:
  - search
  - social:
      enabled: !ENV [SOCIAL_CARDS, false]
